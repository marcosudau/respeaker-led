[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "respeaker-led"
dynamic = ["version"]
description = "Local service controller for the reSpeaker XVF3800 LED ring"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.3,<0.136",
    "libusb-package>=1.0.26.3,<1.1",
    "pydantic>=2.12.5,<2.13",
    "PyYAML>=6.0.2,<7",
    "pyusb>=1.3.1,<2",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn>=0.44.0,<0.45",
]

keywords = ["respeaker", "led", "controller", "xvf3800", "fastapi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
demo = [
    "PySide6>=6.0.0",
]


[project.scripts]
led-controller = "src.interfaces.cli:main"
ledctl = "src.interfaces.cli:main"
respeaker = "src.interfaces.cli:main"
respeaker-led = "src.interfaces.cli:main"
led = "src.interfaces.cli:main"


[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pyinstaller>=6.19.0,<7",
    "pytest>=8.4.0,<9",
]

[tool.hatch.version]
path = "build-tools/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/build-tools",
    "/docs",
    "/main.py",
    "/src",
    "/tests",
    "/tools",
]
