[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "respeaker-led"
dynamic = ["version"]
description = "Local service controller for the reSpeaker XVF3800 LED ring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.3,<0.136",
    "libusb-package>=1.0.26.3,<1.1",
    "pydantic>=2.12.5,<2.13",
    "PyYAML>=6.0.2,<7",
    "pyusb>=1.3.1,<2",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn>=0.44.0,<0.45",
]

keywords = ["respeaker", "led", "controller", "xvf3800", "fastapi", "cli"]
# No "License ::" classifier here: PEP 639 forbids combining one with the
# `license` SPDX expression above, and build backends reject the combination.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
demo = [
    "PySide6>=6.0.0",
]


[project.scripts]
led-controller = "respeaker_led.interfaces.cli:main"
ledctl = "respeaker_led.interfaces.cli:main"
respeaker = "respeaker_led.interfaces.cli:main"
respeaker-led = "respeaker_led.interfaces.cli:main"
led = "respeaker_led.interfaces.cli:main"


[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pyinstaller>=6.19.0,<7",
    "pytest>=8.4.0,<9",
]

[tool.hatch.version]
path = "src/respeaker_led/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/respeaker_led"]

# The effect sets live at the repository root for the build pipeline, but an
# installed wheel has no repository around it — mirror them into the package.
[tool.hatch.build.targets.wheel.force-include]
"effects" = "respeaker_led/effects"

# The sdist ships the library, not the development environment. Keeping the dev
# toolchain out makes the published artifact correct regardless of which of the
# two repositories built it.
[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/docs",
    "/effects",
    "/src",
]
