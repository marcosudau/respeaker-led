# CI for the release repository marcosudau/respeaker-led.
#
# This file is not used in the development repository. sync_release_tree.py
# installs it as .github/workflows/ci.yml in the release repo.
#
# There is no pytest job here on purpose: the test suite is bound to
# tools/effect_building through an autouse fixture in tests/conftest.py, and
# neither tools/ nor tests/ exist in the release repo. Everything is tested in
# marcosudau/led_controller_respeaker before the sync runs. What remains — and
# what matters here — is that the published artifact is actually usable.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


jobs:
  wheel-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build distributions
        run: uv build

      - name: Install the wheel into a clean virtual environment
        shell: bash
        run: |
          python -m venv .smoke
          .smoke/Scripts/python -m pip install --upgrade pip
          .smoke/Scripts/pip install dist/*.whl

      - name: Resources resolve outside the repository
        shell: bash
        run: |
          .smoke/Scripts/python -c "
          from respeaker_led.infrastructure.paths import PACKAGED_DEFAULT_EFFECT_SET_PATH, XVF_HOST_PATH
          assert XVF_HOST_PATH.is_file(), f'missing driver: {XVF_HOST_PATH}'
          assert PACKAGED_DEFAULT_EFFECT_SET_PATH.is_file(), f'missing effects: {PACKAGED_DEFAULT_EFFECT_SET_PATH}'
          print('resources ok')
          "

      - name: Embedded service registers every shipped effect set
        shell: bash
        run: |
          .smoke/Scripts/python -c "
          from pathlib import Path
          from respeaker_led import ControllerService
          from respeaker_led.infrastructure.paths import PACKAGED_EFFECTS_ROOT

          # Comparing against what the wheel ships, rather than just asserting
          # default-effects is there: a set shipped but never registered is
          # exactly the failure this job exists to catch.
          shipped = {p.stem for p in PACKAGED_EFFECTS_ROOT.glob('*.lefxset')}
          assert shipped, f'no effect sets shipped in {PACKAGED_EFFECTS_ROOT}'

          service = ControllerService(use_device=False)
          try:
              registered = {s['source_id'] for s in service.list_effect_sources()}
              missing = shipped - registered
              assert not missing, f'shipped but not registered: {missing}'
              assert service.list_effects(), 'no effects registered'
              print(f'{len(service.list_effects())} effects from {len(registered)} source(s)')
          finally:
              service.stop()
          "

      - name: Console script runs
        shell: bash
        run: .smoke/Scripts/respeaker-led --help
