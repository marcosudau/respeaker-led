name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q --basetemp=.pytest_tmp

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build default effect set
        run: uv run python tools/effect_building/build_lefxset.py --rebuild-packages

      - name: Build release binary
        run: uv run pyinstaller led_controller_service.spec

      - name: Verify release binary
        run: uv run python tools/verify_release_binary.py dist/led_controller_service.exe

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: led_controller_service_windows_x64
          path: dist/led_controller_service.exe

      # -------------------------
      # GitVersion
      # -------------------------
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7

      # -------------------------
      # VERSION.yaml erzeugen
      # -------------------------
      - name: Write VERSION.yaml
        shell: pwsh
        run: |
          $version = "${{ steps.gitversion.outputs.semVer }}"
          $major = "${{ steps.gitversion.outputs.major }}"
          $minor = "${{ steps.gitversion.outputs.minor }}"
          $patch = "${{ steps.gitversion.outputs.patch }}"

          Set-Content VERSION.yaml "version: `"$version`""
          Add-Content VERSION.yaml "major: $major"
          Add-Content VERSION.yaml "minor: $minor"
          Add-Content VERSION.yaml "patch: $patch"
          Add-Content VERSION.yaml "build_metadata: `"`""
          Add-Content VERSION.yaml "commit: `"$env:GITHUB_SHA`""

      - name: Upload VERSION.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: version_file
          path: VERSION.yaml

      # -------------------------
      # src/version.py erzeugen
      # -------------------------
      - name: Write src/version.py
        shell: pwsh
        run: |
          $version = "${{ steps.gitversion.outputs.semVer }}"
          Set-Content src/version.py "__version__ = `"$version`""

      # -------------------------
      # Patch-Tag erstellen
      # -------------------------
      - name: Create Patch Tag
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/v${{ steps.gitversion.outputs.semVer }}",
              sha: context.sha
            })
