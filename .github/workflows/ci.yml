name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q --basetemp=.pytest_tmp

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build release binary
        run: uv run pyinstaller led_controller_service.spec

      - name: Verify release binary
        run: uv run python tools/verify_release_binary.py dist/led_controller_service.exe

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: led_controller_service_windows_x64
          path: dist/led_controller_service.exe