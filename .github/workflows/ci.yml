name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:


jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Run tests
        run: uv run pytest -q --basetemp=.pytest_tmp

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Run build pipeline
        run: uv run python build-tools/build.py

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: led_controller_service_windows_x64
          path: dist/*.exe

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: led_controller_service_release_bundle
          path: dist/release_bundle/*.zip
