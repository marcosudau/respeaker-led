name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate version source
        shell: pwsh
        run: |
          $content = Get-Content build-tools/version.py -Raw
          if ($content -notmatch '__version__\s*=\s*"(.*?)"') {
            throw "Unable to read version from build-tools/version.py"
          }
          if ($Matches[1] -ne "${{ steps.version.outputs.version }}") {
            throw "Tag version does not match build-tools/version.py"
          }

      - name: Run tests
        run: uv run pytest -q --basetemp=.pytest_tmp

      - name: Run build pipeline
        run: uv run python build-tools/build.py

      - name: Resolve release bundle path
        id: bundle
        shell: pwsh
        run: |
          $zipPath = Get-ChildItem dist/release_bundle/*.zip | Select-Object -First 1 -ExpandProperty FullName
          if (-not $zipPath) {
            throw "No release bundle zip found in dist/release_bundle"
          }
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate CHANGELOG.md
        shell: bash
        run: |
          set -e
          current_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || echo "")
          echo "## ${current_tag}" > CHANGELOG.md
          if [ -z "$prev_tag" ]; then
            git log --oneline >> CHANGELOG.md
          else
            git log --oneline "${prev_tag}..${current_tag}" >> CHANGELOG.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.bundle.outputs.zip_path }}
            CHANGELOG.md
          name: LED Controller Service v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          generate_release_notes: false
