name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --all-groups

      # -------------------------
      # Version aus Tag extrahieren
      # -------------------------
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # -------------------------
      # VERSION.yaml erzeugen
      # -------------------------
      - name: Write VERSION.yaml
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $parts = $version.Split(".")
          $major = $parts[0]
          $minor = $parts[1]
          $patch = $parts[2]

          Set-Content VERSION.yaml "version: `"$version`""
          Add-Content VERSION.yaml "major: $major"
          Add-Content VERSION.yaml "minor: $minor"
          Add-Content VERSION.yaml "patch: $patch"
          Add-Content VERSION.yaml "build_metadata: `"`""
          Add-Content VERSION.yaml "commit: `"$env:GITHUB_SHA`""

      # -------------------------
      # src/version.py erzeugen
      # -------------------------
      - name: Write src/version.py
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Set-Content src/version.py "__version__ = `"$version`""

      - name: Run tests
        run: uv run pytest -q --basetemp=.pytest_tmp

      - name: Build default effect set
        run: uv run python tools/effect_building/build_lefxset.py --rebuild-packages

      - name: Build release binary
        run: uv run pyinstaller led_controller_service.spec

      - name: Verify release binary
        run: uv run python tools/verify_release_binary.py dist/led_controller_service.exe

      - name: Assemble release bundle
        run: uv run python tools/assemble_release_bundle.py --version ${{ steps.version.outputs.version }} --exe dist/led_controller_service.exe --output-dir artifacts --force

      - name: Verify release bundle
        run: uv run python tools/verify_release_bundle.py artifacts/led_controller_service_${{ steps.version.outputs.version }}_windows_x64

      - name: Archive release bundle
        id: bundle
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "artifacts/led_controller_service_${{ steps.version.outputs.version }}_windows_x64"
          $zipPath = Join-Path $PWD "artifacts/led_controller_service_${{ steps.version.outputs.version }}_windows_x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $bundleRoot -DestinationPath $zipPath
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # -------------------------
      # Auto-Changelog
      # -------------------------
      - name: Generate CHANGELOG.md
        shell: bash
        run: |
          set -e
          current_tag="${GITHUB_REF_NAME}"
          prev_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || echo "")
          echo "## ${current_tag}" > CHANGELOG.md
          if [ -z "$prev_tag" ]; then
            git log --oneline >> CHANGELOG.md
          else
            git log --oneline "${prev_tag}..${current_tag}" >> CHANGELOG.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.bundle.outputs.zip_path }}
            CHANGELOG.md
            VERSION.yaml
          name: LED Controller Service v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          generate_release_notes: false
